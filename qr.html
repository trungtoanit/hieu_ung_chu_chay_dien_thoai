<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd6e8">
<title>Quét mã nè</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff6fa8; --pink-2: #ffb3d1; --pink-3: #ffe3ef;
    --ink: #5b3448; --cream: #fff9fb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Baloo 2", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 10%, #ffd0e4 0 18%, transparent 40%),
      radial-gradient(circle at 90% 25%, #fff 0 12%, transparent 35%),
      radial-gradient(circle at 80% 90%, #ffc6de 0 15%, transparent 40%),
      linear-gradient(160deg, #ffe6f1, #fff4f8 50%, #ffe0ee);
    overflow-x: hidden;
  }
  main {
    position: relative; z-index: 2;
    min-height: 100svh; max-width: 460px; margin: 0 auto;
    padding: 28px 16px 40px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  h1 {
    margin: 0; font-size: clamp(30px, 9vw, 42px); font-weight: 800; line-height: 1.05;
    text-align: center; color: var(--pink);
    text-shadow: 0 3px 0 #fff, 0 6px 14px rgba(255,111,168,.35);
  }
  h1 span { display: inline-block; animation: hop 1.6s ease-in-out infinite; }
  @keyframes hop { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }

  /* ----- Nhân vật ----- */
  .stage { position: relative; width: min(290px, 78vw); margin-top: 4px; }
  .char { width: 100%; display: block; cursor: pointer; animation: sway 3.2s ease-in-out infinite; transform-origin: 50% 95%; }
  @keyframes sway { 0%,100% { transform: rotate(-3deg) } 50% { transform: rotate(3deg) } }
  .char .eyes { animation: blink 4.5s infinite; transform-origin: 150px 170px; }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
  .char .arm { animation: wave 1.1s ease-in-out infinite; transform-origin: 228px 300px; }
  @keyframes wave { 0%,100% { transform: rotate(0deg) } 50% { transform: rotate(-18deg) } }
  .char.jump { animation: jump .6s ease; }
  @keyframes jump { 0%,100% { transform: translateY(0) } 40% { transform: translateY(-22px) rotate(-4deg) } }

  .bubble {
    position: absolute; top: 0; right: 0; z-index: 2;
    background: #fff; padding: 8px 14px; border-radius: 18px;
    font-weight: 700; font-size: 17px; line-height: 1.2; max-width: 150px;
    box-shadow: 0 6px 18px rgba(255,111,168,.25);
    animation: pop .5s .4s both cubic-bezier(.3,1.6,.5,1);
  }
  .bubble::after {
    content: ""; position: absolute; left: 18px; bottom: -9px;
    border: 10px solid transparent; border-top-color: #fff; border-bottom: 0;
  }
  @keyframes pop { from { transform: scale(0); opacity: 0 } to { transform: scale(1); opacity: 1 } }

  /* ----- Mã QR ----- */
  .hint { margin: 2px 0 0; font-size: 19px; font-weight: 700; text-align: center; }
  .arrow { font-size: 30px; line-height: 1; animation: bounce 1s ease-in-out infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0) } 50% { transform: translateY(8px) } }
  .qr-card {
    position: relative; padding: 14px; background: #fff; border-radius: 26px;
    border: 4px dashed var(--pink-2);
    box-shadow: 0 10px 30px rgba(255,111,168,.3);
    animation: glow 2s ease-in-out infinite;
  }
  @keyframes glow {
    0%,100% { box-shadow: 0 10px 30px rgba(255,111,168,.3), 0 0 0 0 rgba(255,111,168,.35) }
    50% { box-shadow: 0 10px 30px rgba(255,111,168,.3), 0 0 0 14px rgba(255,111,168,0) }
  }
  .qr-card img { display: block; width: min(220px, 60vw); height: auto; image-rendering: pixelated; border-radius: 10px; }
  .corner { position: absolute; font-size: 26px; animation: twinkle 1.6s ease-in-out infinite; }
  .corner.tl { top: -18px; left: -16px; }
  .corner.tr { top: -18px; right: -16px; animation-delay: .4s; }
  .corner.bl { bottom: -18px; left: -16px; animation-delay: .8s; }
  .corner.br { bottom: -18px; right: -16px; animation-delay: 1.2s; }
  @keyframes twinkle { 0%,100% { transform: scale(1) rotate(0) } 50% { transform: scale(1.3) rotate(15deg) } }
  .scanline {
    position: absolute; left: 14px; right: 14px; height: 3px; top: 14px; border-radius: 3px;
    background: linear-gradient(90deg, transparent, var(--pink), transparent);
    animation: scan 2.4s ease-in-out infinite;
  }
  @keyframes scan { 0%,100% { transform: translateY(0) } 50% { transform: translateY(min(220px, 60vw)) } }
  .small { margin: 6px 0 0; font-size: 15px; opacity: .75; text-align: center; }
  .btn {
    margin-top: 4px; display: inline-block; padding: 10px 22px; border-radius: 999px;
    background: var(--pink); color: #fff; text-decoration: none; font-weight: 700; font-size: 17px;
    box-shadow: 0 6px 0 #e0508a; transition: transform .1s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #e0508a; }

  /* ----- Hoa giấy & tim bay ----- */
  .fx { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .petal { position: absolute; top: -40px; will-change: transform; animation: fall linear forwards; }
  @keyframes fall {
    to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); }
  }
  .burst { position: fixed; z-index: 3; pointer-events: none; font-size: 22px; animation: burst 1s ease-out forwards; }
  @keyframes burst {
    from { transform: translate(-50%,-50%) scale(.4); opacity: 1 }
    to { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.2); opacity: 0 }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<div class="fx" id="fx"></div>

<main>
  <h1><span>Hé</span> <span style="animation-delay:.15s">lô</span> <span style="animation-delay:.3s">em</span> <span style="animation-delay:.45s">💕</span></h1>

  <div class="stage">
    <div class="bubble" id="bubble">Quét mã này đi nè~</div>
    <!-- Nhân vật chibi: tóc nâu buộc sau, kính tròn gọng mảnh, tai nghe trắng, áo len trắng -->
    <svg class="char" id="char" viewBox="0 0 300 380" role="img" aria-label="Cô gái hoạt hình đeo kính tròn đang vẫy tay">
      <defs>
        <radialGradient id="skin" cx="50%" cy="40%" r="60%">
          <stop offset="0" stop-color="#fff0e6"/><stop offset="1" stop-color="#f9d8c4"/>
        </radialGradient>
        <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7a4a30"/><stop offset="1" stop-color="#5a3322"/>
        </linearGradient>
        <linearGradient id="sweater" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1ebee"/>
        </linearGradient>
      </defs>

      <!-- búi tóc phía sau -->
      <circle cx="205" cy="70" r="30" fill="url(#hair)"/>
      <!-- tóc phía sau đầu -->
      <ellipse cx="150" cy="160" rx="96" ry="104" fill="url(#hair)"/>

      <!-- thân & áo len trắng -->
      <path d="M62 380 C62 300 95 268 150 266 C205 268 238 300 238 380 Z" fill="url(#sweater)" stroke="#e8dde2" stroke-width="2"/>
      <path d="M118 268 L150 304 L182 268" fill="none" stroke="#e8dde2" stroke-width="3" stroke-linecap="round"/>
      <rect x="133" y="236" width="34" height="36" rx="14" fill="#f6d2bd"/>
      <path d="M126 270 Q150 300 174 270 L168 268 Q150 288 132 268 Z" fill="#f6d2bd"/>

      <!-- tay trái ôm hoa giấy -->
      <g>
        <path d="M80 330 Q96 300 128 312" fill="none" stroke="#e3d6dc" stroke-width="30" stroke-linecap="round"/>
        <path d="M80 330 Q96 300 128 312" fill="none" stroke="#fbf7f9" stroke-width="25" stroke-linecap="round"/>
        <circle cx="128" cy="314" r="11" fill="#f9d8c4"/>
        <g transform="translate(118 300)">
          <circle cx="0" cy="0" r="9" fill="#ff6fa8"/><circle cx="12" cy="-6" r="8" fill="#ff9ec4"/>
          <circle cx="6" cy="9" r="7" fill="#ffffff" stroke="#ffd0e4"/><circle cx="-10" cy="7" r="7" fill="#ff86b6"/>
          <circle cx="2" cy="1" r="2.5" fill="#fff3a6"/>
        </g>
      </g>

      <!-- tay phải vẫy -->
      <g class="arm">
        <path d="M222 304 Q246 270 252 236" fill="none" stroke="#e3d6dc" stroke-width="28" stroke-linecap="round"/>
        <path d="M222 304 Q246 270 252 236" fill="none" stroke="#fbf7f9" stroke-width="23" stroke-linecap="round"/>
        <circle cx="253" cy="228" r="13" fill="#f9d8c4"/>
      </g>

      <!-- tai -->
      <ellipse cx="80" cy="178" rx="11" ry="15" fill="#f6d2bd"/>
      <ellipse cx="220" cy="178" rx="11" ry="15" fill="#f6d2bd"/>

      <!-- mặt -->
      <path d="M82 150 C82 96 112 72 150 72 C188 72 218 96 218 150 C218 205 190 246 150 248 C110 246 82 205 82 150 Z" fill="url(#skin)"/>

      <!-- tóc mái rẽ ngôi giữa -->
      <path d="M150 64 C110 64 78 92 76 150 C76 170 80 190 86 204 C86 160 98 118 150 90 Z" fill="url(#hair)"/>
      <path d="M150 64 C190 64 222 92 224 150 C224 170 220 190 214 204 C214 160 202 118 150 90 Z" fill="url(#hair)"/>
      <path d="M150 66 Q148 80 150 92" stroke="#4a2a1c" stroke-width="2" fill="none"/>
      <!-- lọn tóc mai hai bên -->
      <path d="M90 150 Q84 196 98 226" stroke="#6a3d28" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M210 150 Q216 196 202 226" stroke="#6a3d28" stroke-width="7" fill="none" stroke-linecap="round"/>
      <!-- bóng tóc -->
      <path d="M112 92 Q128 80 146 78" stroke="#a46a48" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>

      <!-- mắt -->
      <g class="eyes">
        <ellipse cx="122" cy="172" rx="13" ry="16" fill="#3b2418"/>
        <ellipse cx="178" cy="172" rx="13" ry="16" fill="#3b2418"/>
        <circle cx="126" cy="166" r="5" fill="#fff"/><circle cx="182" cy="166" r="5" fill="#fff"/>
        <circle cx="118" cy="178" r="2.5" fill="#fff" opacity=".8"/><circle cx="174" cy="178" r="2.5" fill="#fff" opacity=".8"/>
      </g>
      <!-- lông mày -->
      <path d="M106 144 Q120 138 134 143" stroke="#6a3d28" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M166 143 Q180 138 194 144" stroke="#6a3d28" stroke-width="3.5" fill="none" stroke-linecap="round"/>

      <!-- kính tròn gọng mảnh -->
      <g fill="rgba(255,255,255,.18)" stroke="#9a7a5c" stroke-width="3">
        <circle cx="122" cy="172" r="27"/>
        <circle cx="178" cy="172" r="27"/>
      </g>
      <path d="M149 170 Q150 165 151 170" stroke="#9a7a5c" stroke-width="3" fill="none"/>
      <path d="M95 168 L82 164 M205 168 L218 164" stroke="#9a7a5c" stroke-width="3" stroke-linecap="round"/>
      <path d="M106 158 Q112 150 120 150" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
      <path d="M162 158 Q168 150 176 150" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>

      <!-- má hồng, mũi, môi -->
      <ellipse cx="108" cy="206" rx="13" ry="7" fill="#ff9ab8" opacity=".55"/>
      <ellipse cx="192" cy="206" rx="13" ry="7" fill="#ff9ab8" opacity=".55"/>
      <path d="M148 196 Q150 200 152 196" stroke="#e0a58c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M138 216 Q150 228 162 216 Q150 220 138 216 Z" fill="#f2665e"/>

      <!-- tai nghe trắng có dây -->
      <circle cx="222" cy="184" r="7" fill="#fff" stroke="#ddd" stroke-width="1.5"/>
      <path d="M222 191 Q226 230 206 262 Q192 290 196 330" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M222 191 Q226 230 206 262 Q192 290 196 330" stroke="#e3dbe0" stroke-width="1" fill="none" stroke-linecap="round" opacity=".8"/>

      <!-- kẹp tóc hoa -->
      <g transform="translate(196 92)">
        <circle cx="0" cy="-7" r="6" fill="#ff86b6"/><circle cx="7" cy="0" r="6" fill="#ff86b6"/>
        <circle cx="0" cy="7" r="6" fill="#ff86b6"/><circle cx="-7" cy="0" r="6" fill="#ff86b6"/>
        <circle cx="0" cy="0" r="4" fill="#fff3a6"/>
      </g>
    </svg>
  </div>

  <p class="hint">Có một bất ngờ đang chờ em đó!</p>
  <div class="arrow">👇</div>

  <div class="qr-card">
    <img src="qr.png" alt="Mã QR dẫn tới lời nhắn bất ngờ" width="250" height="250">
    <div class="scanline"></div>
    <span class="corner tl">💖</span><span class="corner tr">✨</span>
    <span class="corner bl">🌸</span><span class="corner br">💌</span>
  </div>

  <p class="small">Mở camera điện thoại và hướng vào mã nhé ~ ♡<br>(nhớ xoay ngang màn hình khi xem nha)</p>
  <a class="btn" href="./">Hoặc bấm vào đây 💌</a>
</main>

<script>
  // Hoa giấy (bougainvillea) & tim rơi
  const fx = document.getElementById("fx");
  const items = ["🌸", "💗", "🌸", "💕", "✿", "🤍"];
  function spawnPetal() {
    const el = document.createElement("span");
    el.className = "petal";
    el.textContent = items[Math.floor(Math.random() * items.length)];
    el.style.left = Math.random() * 100 + "vw";
    el.style.fontSize = 14 + Math.random() * 16 + "px";
    el.style.color = Math.random() > .5 ? "#ff6fa8" : "#ffb3d1";
    el.style.opacity = .55 + Math.random() * .45;
    el.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
    el.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
    el.style.animationDuration = 6 + Math.random() * 6 + "s";
    fx.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
  }
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    for (let i = 0; i < 8; i++) setTimeout(spawnPetal, i * 300);
    setInterval(spawnPetal, 550);
  }

  // Chạm đâu cũng nổ tim
  function burst(x, y, n = 8) {
    for (let i = 0; i < n; i++) {
      const b = document.createElement("span");
      b.className = "burst";
      b.textContent = ["💖", "💕", "✨", "🌸"][i % 4];
      const a = (Math.PI * 2 * i) / n, r = 50 + Math.random() * 40;
      b.style.left = x + "px"; b.style.top = y + "px";
      b.style.setProperty("--x", Math.cos(a) * r + "px");
      b.style.setProperty("--y", Math.sin(a) * r + "px");
      document.body.appendChild(b);
      b.addEventListener("animationend", () => b.remove());
    }
  }
  addEventListener("pointerdown", e => burst(e.clientX, e.clientY));

  // Chạm vào nhân vật: nhảy lên và đổi lời thoại
  const char = document.getElementById("char"), bubble = document.getElementById("bubble");
  const lines = ["Quét mã này đi nè~", "Hihi, nhột quá!", "Bất ngờ lắm đó 💝", "Nhanh lên nàooo~", "Thương em nhiều 💕"];
  let li = 0;
  char.addEventListener("click", () => {
    char.classList.remove("jump"); void char.offsetWidth; char.classList.add("jump");
    li = (li + 1) % lines.length;
    bubble.textContent = lines[li];
    bubble.style.animation = "none"; void bubble.offsetWidth; bubble.style.animation = "";
  });
  char.addEventListener("animationend", e => { if (e.animationName === "jump") char.classList.remove("jump"); });
</script>
</body>
</html>
