<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Gửi em</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* Luôn hiển thị ngang: nếu điện thoại đang cầm dọc thì xoay khung 90° */
  #wrap { position: fixed; top: 0; left: 0; transform-origin: top left; }
  #wrap.rotated { transform: rotate(90deg) translateY(-100%); }
  canvas { position: absolute; inset: 0; display: block; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="rain"></canvas>
  <canvas id="fx"></canvas>
</div>
<script>
/* ======================= SỬA NỘI DUNG Ở ĐÂY ======================= */
// Mỗi phần tử là một câu, hiện lần lượt. Dùng \n để tự xuống dòng
// (nếu không có \n, câu dài sẽ tự ngắt dòng cho vừa màn hình).
// Ghi "<3" để hiện trái tim.
const MESSAGES = [
  "Em à…",
  "Anh đã từng nghĩ rằng,\ngặp gỡ một người\nchỉ là chuyện tình cờ.",
  "Cho đến khi em xuất hiện,\nanh mới hiểu rằng\ncó những cuộc gặp gỡ",
  "khiến người ta muốn\ndành cả tương lai\nđể gìn giữ.",
  "Giữa hàng triệu người\ntrên thế giới,\nanh lại gặp được em,",
  "lại nhớ về em,\nlại mong được gặp em\nmỗi ngày.",
  "Anh thích cảm giác\nđược nói chuyện với em,\nthích nhìn em cười,",
  "thích cả những khoảnh khắc\nbình thường\nkhi hai chúng ta ở cạnh nhau.",
  "Anh không biết tương lai\nsẽ như thế nào.",
  "Nhưng nếu được lựa chọn,\nanh muốn trong những\nnăm tháng sau này,",
  "người cùng anh ăn cơm,\ncùng anh đi dạo,",
  "cùng anh chia sẻ\nnhững vui buồn,",
  "sẽ là em.",
  "Anh không hứa sẽ mang đến\ncho em một cuộc sống\nhoàn hảo.",
  "Nhưng anh sẽ cố gắng\nđể em cảm thấy\nmình luôn được yêu thương,",
  "được trân trọng\nvà được ưu tiên.",
  "Anh không cần em\nlà người hoàn hảo nhất.",
  "Bởi vì người anh thích\nlà em,",
  "chứ không phải\nmột phiên bản hoàn hảo\nnào của em.",
  "Thế giới này\nrộng lớn như vậy,",
  "gặp được nhau\nđã là một điều may mắn.",
  "Vậy nên, anh không muốn\nchúng ta chỉ dừng lại\nở hai chữ tình cờ.",
  "Anh muốn viết tiếp\ncâu chuyện này,",
  "không chỉ hôm nay,\nmà còn rất nhiều\nngày sau nữa.",
  "Anh yêu em.",
  "<3",
];
const RAIN_ONLY_SECONDS = 3;    // chỉ có mưa chữ trước khi hiện câu đầu
const HOLD_SECONDS      = 2.2;  // thời gian giữ tối thiểu mỗi câu (câu dài sẽ được giữ lâu hơn)
const LOOP              = true; // hết thì lặp lại
/* ================================================================== */

// Có thể truyền nội dung qua link: ?msg=Câu 1|Câu 2|<3
const q = new URLSearchParams(location.search).get("msg");
const messages = q ? q.split("|").map(s => s.replace(/\\n/g, "\n")) : MESSAGES;

const rain = document.getElementById("rain"), rctx = rain.getContext("2d");
const fx = document.getElementById("fx"), ctx = fx.getContext("2d");
let W, H, dpr, fontSize, cols, drops;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vw = innerWidth, vh = innerHeight, portrait = vh > vw;
  W = Math.max(vw, vh); H = Math.min(vw, vh);  // luôn là khung ngang
  const wrap = document.getElementById("wrap");
  wrap.classList.toggle("rotated", portrait);
  wrap.style.width = W + "px"; wrap.style.height = H + "px";
  for (const c of [rain, fx]) {
    c.width = W * dpr; c.height = H * dpr;
    c.style.width = W + "px"; c.style.height = H + "px";
  }
  rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fontSize = W < 600 ? 13 : 16;
  cols = Math.ceil(W / fontSize);
  drops = Array.from({ length: cols }, () => Math.random() * -H / fontSize);
  rctx.fillStyle = "#000"; rctx.fillRect(0, 0, W, H);
  if (current) setTargets(current);
}

/* ---------- Mưa chữ 0/1 ---------- */
function drawRain() {
  rctx.fillStyle = "rgba(0,0,0,0.09)";
  rctx.fillRect(0, 0, W, H);
  rctx.font = `${fontSize}px "Courier New", monospace`;
  for (let i = 0; i < cols; i++) {
    const y = drops[i] * fontSize;
    if (y > 0) {
      rctx.fillStyle = Math.random() > 0.93 ? "#fff" : "rgba(220,220,220,0.7)";
      rctx.fillText(Math.random() > 0.5 ? "1" : "0", i * fontSize, y);
    }
    if (y > H && Math.random() > 0.975) drops[i] = 0;
    drops[i] += 1;
  }
}

/* ---------- Chữ ghép từ hạt sáng ---------- */
const off = document.createElement("canvas"), octx = off.getContext("2d", { willReadFrequently: true });
const FONT = '"Arial Black", "Helvetica Neue", Arial, sans-serif';
let particles = [], current = null, dot = 2.6, textBox = null, boxA = 0;
const MAX_PARTICLES = 4500;

function wrap(text, size, maxW) {
  octx.font = `900 ${size}px ${FONT}`;
  const out = [];
  for (const para of text.split("\n")) {
    let line = "";
    for (const w of para.split(" ")) {
      const t = line ? line + " " + w : w;
      if (line && octx.measureText(t).width > maxW) { out.push(line); line = w; } else line = t;
    }
    out.push(line);
  }
  return out;
}

function textPoints(text) {
  const maxW = W * 0.9, maxH = H * 0.7;
  // Giữ nguyên các dòng đã ngắt sẵn, thu nhỏ chữ cho vừa; chỉ tự ngắt khi chữ quá nhỏ
  let lines = text.split("\n");
  octx.font = `900 100px ${FONT}`;
  const widest100 = Math.max(...lines.map(l => octx.measureText(l).width));
  let size = Math.min(Math.min(W, H) * 0.2, maxW * 100 / widest100, maxH / (lines.length * 1.2));
  if (size < Math.min(W, H) * 0.08) {
    for (size = Math.min(W, H) * 0.2; size > 14; size *= 0.93) {
      lines = wrap(text, size, maxW);
      octx.font = `900 ${size}px ${FONT}`;
      const widest = Math.max(...lines.map(l => octx.measureText(l).width));
      if (widest <= maxW && lines.length * size * 1.2 <= maxH) break;
    }
  }
  off.width = W; off.height = H;
  octx.clearRect(0, 0, W, H);
  octx.fillStyle = "#fff"; octx.textAlign = "center"; octx.textBaseline = "middle";
  octx.font = `900 ${size}px ${FONT}`;
  const lh = size * 1.2, top = H / 2 - (lines.length - 1) * lh / 2;
  lines.forEach((l, i) => octx.fillText(l, W / 2, top + i * lh));
  const data = octx.getImageData(0, 0, W, H).data;
  // Hạt dày đặc để chữ đậm, dễ đọc trên điện thoại; giới hạn số hạt cho mượt
  let filled = 0, x0 = W, x1 = 0, y0 = H, y1 = 0;
  for (let y = 0; y < H; y += 2)
    for (let x = 0; x < W; x += 2)
      if (data[(y * W + x) * 4 + 3] > 128) {
        filled++;
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
  const step = Math.max(2, Math.ceil(2 * Math.sqrt(filled / MAX_PARTICLES)));
  dot = step * 0.92;
  textBox = filled ? { x: x0, y: y0, w: x1 - x0, h: y1 - y0 } : null;
  const pts = [];
  for (let y = 0; y < H; y += step)
    for (let x = 0; x < W; x += step)
      if (data[(y * W + x) * 4 + 3] > 128) pts.push([x, y]);
  return pts;
}

function heartPoints() {
  const pts = [], s = Math.min(W, H) / 38;
  for (let i = 0; i < 1400; i++) {
    const t = Math.random() * Math.PI * 2;
    const r = Math.random() < 0.65 ? 1 : Math.sqrt(Math.random()); // viền dày, ruột thưa
    const x = 16 * Math.sin(t) ** 3;
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    pts.push([W / 2 + x * s * r, H / 2 - y * s * r - s]);
  }
  return pts;
}

function setTargets(msg) {
  current = msg;
  let pts;
  if (msg.trim() === "<3") { pts = heartPoints(); dot = 3; textBox = null; }
  else pts = textPoints(msg);
  pts.sort(() => Math.random() - 0.5);
  while (particles.length < pts.length) {
    particles.push({ x: Math.random() * W, y: -20 - Math.random() * H, vx: 0, vy: 0, tx: 0, ty: 0, on: false, a: 0 });
  }
  particles.forEach((p, i) => {
    if (i < pts.length) { p.tx = pts[i][0]; p.ty = pts[i][1]; p.on = true; }
    else p.on = false;
  });
}

function scatter() {
  textBox = null;
  for (const p of particles) {
    p.on = false;
    const ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 6;
    p.vx = Math.cos(ang) * sp; p.vy = Math.sin(ang) * sp - 1;
  }
}

let beat = 0, lastBox = null;
const solid = [];
function drawFx(f = 1) {   // f = số khung 60fps đã trôi qua (máy chậm vẫn chạy đúng nhịp)
  ctx.clearRect(0, 0, W, H);
  beat += 0.06 * f;
  const isHeart = current && current.trim() === "<3";
  const pulse = isHeart ? 1 + Math.sin(beat * 2) * 0.04 : 1;
  // Nền tối mờ sau chữ để mưa số không lẫn vào chữ
  boxA += ((textBox ? 0.72 : 0) - boxA) * Math.min(1, 0.06 * f);
  if (boxA > 0.01 && (textBox || lastBox)) {
    const b = textBox || lastBox, pad = Math.min(W, H) * 0.06;
    lastBox = b;
    ctx.globalAlpha = boxA;
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(b.x - pad, b.y - pad, b.w + pad * 2, b.h + pad * 2, pad)
                  : ctx.rect(b.x - pad, b.y - pad, b.w + pad * 2, b.h + pad * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = "#fff";
  const d = dot, h = d / 2, damp = Math.pow(0.82, f);
  for (const p of particles) {
    if (p.on) {
      const tx = W / 2 + (p.tx - W / 2) * pulse, ty = H / 2 + (p.ty - H / 2) * pulse;
      p.vx = (p.vx + (tx - p.x) * 0.02 * f) * damp;
      p.vy = (p.vy + (ty - p.y) * 0.02 * f) * damp;
      p.a = Math.min(1, p.a + 0.04 * f);
    } else {
      p.vy += 0.05 * f;
      p.a = Math.max(0, p.a - 0.02 * f);
    }
    p.x += p.vx * f; p.y += p.vy * f;
    if (p.a <= 0) continue;
    if (p.a >= 1) { solid.push(p); continue; }
    ctx.globalAlpha = p.a;
    ctx.fillRect(p.x - h, p.y - h, d, d);
  }
  // Vẽ gộp các hạt đã hiện rõ (nhanh hơn nhiều trên điện thoại)
  ctx.globalAlpha = 1;
  ctx.beginPath();
  for (const p of solid) ctx.rect(p.x - h, p.y - h, d, d);
  ctx.fill();
  solid.length = 0;
}

let lastT = 0, rainAcc = 0;
function loop(t) {
  const dt = lastT ? Math.min(t - lastT, 100) : 16.7;
  lastT = t;
  rainAcc += dt;
  if (rainAcc >= 45) { drawRain(); rainAcc = 0; }   // mưa số không cần 60fps
  drawFx(dt / 16.7);
  requestAnimationFrame(loop);
}
addEventListener("resize", resize);
resize();
requestAnimationFrame(loop);

/* ---------- Kịch bản: lần lượt từng câu ---------- */
const sleep = s => new Promise(r => setTimeout(r, s * 1000));
(async () => {
  await sleep(RAIN_ONLY_SECONDS);
  do {
    for (const m of messages) {
      setTargets(m);
      await sleep(1.6 + HOLD_SECONDS + Math.min(m.length * 0.045, 3));
      if (m === messages[messages.length - 1] && !LOOP) return;
      scatter();
      await sleep(1.4);
    }
    current = null;
    await sleep(1.5);
  } while (LOOP);
})();
</script>
</body>
</html>
